<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipt-Generator</title>
    <link rel="stylesheet" href="./src/output.css">
    <script src="./js/script.js"></script>
    
<style>
/* Logo Based Theme: Deep Blue + Orange */

body{
    background: linear-gradient(135deg,#0f2f73,#163d8f,#1d4fb8,#f59e0b);
    min-height:100vh;
}

/* Glassmorphism Container */
.glass{
    background: rgba(255,255,255,0.10);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border: 1px solid rgba(255,255,255,0.15);
    box-shadow: 0 20px 45px rgba(0,0,0,0.18);
}

/* Heading */
h1{
    color:#ffffff;
    text-shadow:0 2px 10px rgba(0,0,0,0.18);
}

/* Inputs */
.input-box{
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.16);
    color: white;
    transition:0.3s ease;
}

.input-box::placeholder{
    color: rgba(255,255,255,0.62);
}

.input-box:focus{
    background: rgba(255,255,255,0.14);
    border-color:#f59e0b;
    box-shadow:0 0 0 3px rgba(245,158,11,0.25);
}

/* Labels */
label{
    color:#e8f0ff;
}

/* Generate Button */
button[type="submit"]{
    background: linear-gradient(135deg,#f59e0b,#ffb21e);
    color:white;
    font-weight:700;
    border:none;
}

button[type="submit"]:hover{
    background: linear-gradient(135deg,#e68a00,#f59e0b);
    transform: translateY(-2px);
}

/* Reset Button */
button[type="reset"]{
    background: linear-gradient(135deg,#163d8f,#295ec7);
    color:white;
    font-weight:700;
    border:none;
}

button[type="reset"]:hover{
    background: linear-gradient(135deg,#102e6e,#163d8f);
    transform: translateY(-2px);
}

/* Smooth Buttons */
button{
    transition:0.3s ease;
    box-shadow:0 10px 25px rgba(0,0,0,0.15);
}
</style>
</style>

</head>

<body class="min-h-screen flex items-center justify-center p-6">

<div class="w-full max-w-5xl glass rounded-3xl shadow-2xl p-8">

    <h1 class="text-4xl font-bold text-center text-white mb-10 tracking-wide">
        Receipt Entry Form
    </h1>

    <form class="grid grid-cols-1 md:grid-cols-2 gap-6">

        <!-- Receipt Number -->
        <div>
            <label class="block text-white font-medium mb-2">Receipt No.</label>
            <input type="text" placeholder="Enter receipt number"
            class="w-full input-box rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-violet-300">
        </div>

        <!-- Date -->
        <div>
            <label class="block text-white font-medium mb-2">Date</label>
            <input type="date"
            class="w-full input-box rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-violet-300">
        </div>

        <!-- Received From -->
        <div class="md:col-span-2">
            <label class="block text-white font-medium mb-2">Received With Thanks From</label>
            <input type="text" placeholder="Student / Parent Name"
            class="w-full input-box rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-violet-300">
        </div>

        <!-- Amount -->
        <div>
            <label class="block text-white font-medium mb-2">Amount (₹)</label>
            <input type="number" placeholder="Enter amount"
            class="w-full input-box rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-violet-300">
        </div>

        <!-- Installment -->
        <div>
            <label class="block text-white font-medium mb-2">Installment</label>
            <input type="text" placeholder="1st / 2nd / Final"
            class="w-full input-box rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-violet-300">
        </div>

        <!-- Payment -->
        <div>
            <label class="block text-white font-medium mb-5">Payment Mode</label>

            <div class="flex gap-15 items-center text-white">

                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="radio" name="paymentMode" value="Cash"
                    class="w-4 h-4 accent-orange-400">
                    Cash
                </label>

                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="radio" name="paymentMode" value="Online"
                    class="w-4 h-4 accent-orange-400">
                    Online
                </label>

            </div>
        </div>

        
        <!-- Course -->
        <div>
            <label class="block text-white font-medium mb-2">Course Name</label>
            <input type="text" placeholder="Course Name"
            class="w-full input-box rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-violet-300">
        </div>

        <!-- Buttons -->
        <div class="md:col-span-2 flex justify-center gap-4 mt-8">

            <button type="submit"
            class="bg-white text-purple-700 hover:bg-violet-100 px-8 py-3 rounded-xl font-semibold shadow-lg transition">
                Generate Receipt
            </button>

            <button type="reset"
            class="bg-violet-700 hover:bg-violet-800 text-white px-8 py-3 rounded-xl font-semibold shadow-lg transition">
                Reset
            </button>

        </div>

    </form>

</div>

</body>
</html>
